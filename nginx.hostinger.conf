# Configuration Nginx pour déploiement Hostinger avec PM2
# L'architecture est différente de Docker: 2 processus PM2 au lieu de 4 conteneurs
# - Node.js (Express) sert le build React complet sur port 3000
# - Python (FastAPI) gère l'analyse de documents sur port 8000
# Routes:
# - / -> Node.js (sert le SPA React avec toutes les routes)
# - /api/*, /auth/* -> Node.js
# - /submit-analysis -> Python
# Commandes:
# sudo cp nginx.hostinger.conf /etc/nginx/sites-available/workandyou
# sudo ln -s /etc/nginx/sites-available/workandyou /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name votre-domaine.com www.votre-domaine.com;

    # Redirection HTTPS (activer après configuration SSL)
    # return 301 https://$server_name$request_uri;

    # Taille maximale des uploads
    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/workandyou-access.log;
    error_log /var/log/nginx/workandyou-error.log;

    # Page d'accueil et routes frontend
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        
        # Support SPA - toutes les routes frontend passent par le serveur Node.js
        # qui sert le build React et gère le routing côté serveur
    }

    # API Node.js (Signatures, Auth)
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Authentification Google OAuth
    location /auth {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Python (Méthode Work&You - Analyse de documents)
    location /submit-analysis {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check
    location /health {
        access_log off;
        proxy_pass http://localhost:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# Configuration HTTPS (activée automatiquement par Certbot)
