version: '3.8'

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: outils-workandyou-dev
    ports:
      - "5173:5173"  # Vite dev server
      - "5174:5174"  # Express API server
    environment:
      - NODE_ENV=development
      - VITE_PROXY_API_TARGET=http://localhost:5174
      # Variables d'environnement (à personnaliser via .env)
      - GITHUB_PAT=${GITHUB_PAT}
      - REPO_OWNER=${REPO_OWNER:-MatheoWY}
      - REPO_NAME=${REPO_NAME:-signatures}
      - BRANCH=${BRANCH:-main}
      - WORKANDYOU_API_URL=${WORKANDYOU_API_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ALLOWED_DOMAIN=${ALLOWED_DOMAIN:-workandyou.fr}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:5174/auth/google/callback}
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - app-network
    stdin_open: true
    tty: true

networks:
  app-network:
    driver: bridge

