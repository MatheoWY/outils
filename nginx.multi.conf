# Configuration Nginx pour architecture multi-services Docker
# Reverse proxy qui route les requêtes vers les 5 services:
# - /carte -> Service Carte (port 80)
# - /flux -> Service Flux (port 80)  
# - /signatures, /api/*, /auth/* -> Service Signatures (port 3000)
# - /methode, /submit-analysis -> Service Méthode (port 8000)
# - /n8n -> Service n8n (port 5678)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Configuration du reverse proxy
    upstream carte {
        server carte:80;
    }

    upstream flux {
        server flux:80;
    }

    upstream signatures {
        server signatures:3000;
    }

    upstream methode {
        server methode:8000;
    }

    upstream n8n {
        server n8n:5678;
    }

    # Redirection HTTP vers HTTPS
    server {
        listen 80;
        server_name outils.workandyou.fr;
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Configuration HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name outils.workandyou.fr;

        # Certificats SSL
        ssl_certificate /etc/letsencrypt/live/outils.workandyou.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/outils.workandyou.fr/privkey.pem;

        # Configuration SSL moderne
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Augmenter les tailles maximales pour les uploads
        client_max_body_size 20M;

        # Page d'accueil - redirige vers la carte
        location = / {
            proxy_pass http://carte/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Service Carte Work&You
        location /carte {
            rewrite ^/carte(/.*)$ $1 break;
            rewrite ^/carte$ / break;
            
            proxy_pass http://carte;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Support SPA
            proxy_intercept_errors on;
            error_page 404 = @carte_fallback;
        }

        location @carte_fallback {
            proxy_pass http://carte;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Service Check Flux
        location /flux {
            rewrite ^/flux(/.*)$ $1 break;
            rewrite ^/flux$ / break;
            
            proxy_pass http://flux;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Support SPA
            proxy_intercept_errors on;
            error_page 404 = @flux_fallback;
        }

        location @flux_fallback {
            proxy_pass http://flux;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Service Signatures (Frontend + Backend)
        location /signatures {
            proxy_pass http://signatures;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Support uploads
            proxy_request_buffering off;
        }

        # API pour Signatures et Flux
        location /api {
            proxy_pass http://signatures;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Support uploads
            proxy_request_buffering off;
        }

        # Auth pour Signatures
        location /auth {
            proxy_pass http://signatures;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Service Méthode Work&You (Frontend + Backend Python)
        location /methode {
            proxy_pass http://methode;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Support uploads de fichiers volumineux
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        # API Python pour analyse
        location /submit-analysis {
            proxy_pass http://methode;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Support uploads volumineux et temps de traitement long
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Service n8n (Workflow Automation)
        location /n8n/ {
            proxy_pass http://n8n/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            
            # Support WebSocket pour n8n
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts pour workflows longs
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            
            # Support uploads
            proxy_request_buffering off;
        }

        # Assets statiques (CSS, JS, etc.)
        location /assets/ {
            proxy_pass http://carte/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Favicon
        location /favicon.ico {
            proxy_pass http://carte/favicon.ico;
            proxy_set_header Host $host;
        }

        # Health check global
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}

