# Configuration Docker Compose - Architecture Unifiée avec Auth
# Un seul service Node.js/Express qui sert tous les frontends et gère l'authentification Google

version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: workandyou-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.simple.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - methode-api
      - n8n
    networks:
      - workandyou-network
    restart: unless-stopped

  # Service principal : Application complète avec auth
  app:
    build:
      context: .
      dockerfile: Dockerfile.unified
    container_name: workandyou-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GITHUB_PAT=${GITHUB_PAT}
      - REPO_OWNER=${REPO_OWNER:-MatheoWY}
      - REPO_NAME=${REPO_NAME:-signatures}
      - BRANCH=${BRANCH:-main}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ALLOWED_DOMAIN=${ALLOWED_DOMAIN:-workandyou.fr}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - RUNPOD_API_URL=${RUNPOD_API_URL}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
    networks:
      - workandyou-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service Python pour l'analyse (Méthode Work&You)
  methode-api:
    build:
      context: .
      dockerfile: Dockerfile.methode
    container_name: workandyou-methode-api
    environment:
      - RUNPOD_API_URL=${RUNPOD_API_URL}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
    networks:
      - workandyou-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service n8n (Workflow Automation)
  n8n:
    image: n8nio/n8n:latest
    container_name: workandyou-n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://outils.workandyou.fr/n8n/}
      - GENERIC_TIMEZONE=Europe/Paris
      - N8N_METRICS=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - workandyou-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  workandyou-network:
    driver: bridge

volumes:
  n8n_data:
    driver: local

